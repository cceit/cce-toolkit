{% load i18n %}
{% for error in errors %}
    <div class="alert alert-danger alert-dismissible fade show fieldalert {{ field_id_for_label }}_field_alert" role="alert">
      <strong>
          <i class="fa-solid fa-lg fa-fw fa-exclamation"></i>
          {{ error }}
      </strong>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="{% trans 'Close' %}"></button>
    </div>
{% endfor %}
